<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>芝心調香室</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 版型：桌機左側導覽＋主欄；手機底部導覽。調配台結果做成藥劑瓶標籤。 */
:root{
  --bg:#eef1ea; --surface:#fbfcf8; --sunk:#e4e9df; --ink:#1d2b25; --muted:#5d6b63; --line:#d3dacd;
  --accent:#2f5d4a; --accent-ink:#fff; --amber:#b86a24; --amber-soft:#f3e3cf;
  --t:#c99a2e; --m:#5f8f62; --b:#7b5a42;
  --ok:#3f7a52; --warn:#a8711c; --bad:#a6473b; --ok-bg:#e1efe4; --warn-bg:#f6ead3; --bad-bg:#f4dfdb;
  --display:"LXGW WenKai TC","Noto Serif TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:14px; --shadow:0 1px 0 rgba(29,43,37,.04),0 6px 20px rgba(29,43,37,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111814; --surface:#18211c; --sunk:#202b25; --ink:#e3eae2; --muted:#9aa89f; --line:#2e3b34;
  --accent:#7fb89a; --accent-ink:#0f1a14; --amber:#e0a060; --amber-soft:#3a2b1b;
  --t:#e2b850; --m:#86b989; --b:#c29775;
  --ok:#86c79a; --warn:#e3b55f; --bad:#ec8e80; --ok-bg:#1d3326; --warn-bg:#3a2f18; --bad-bg:#3d221e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111814; --surface:#18211c; --sunk:#202b25; --ink:#e3eae2; --muted:#9aa89f; --line:#2e3b34;
  --accent:#7fb89a; --accent-ink:#0f1a14; --amber:#e0a060; --amber-soft:#3a2b1b;
  --t:#e2b850; --m:#86b989; --b:#c29775;
  --ok:#86c79a; --warn:#e3b55f; --bad:#ec8e80; --ok-bg:#1d3326; --warn-bg:#3a2f18; --bad-bg:#3d221e; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:22px} h3{font-size:17px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--surface) 210px,var(--line) 210px,var(--line) 211px,var(--bg) 211px)}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand svg{width:40px;height:40px;flex:none}
.brand b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a .ic{width:22px;text-align:center;font-family:var(--display);font-size:17px;color:var(--muted)}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav a[aria-current="page"] .ic{color:inherit}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted);padding:0 6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.busy i{background:var(--warn)}

main{padding:26px clamp(16px,3vw,38px) 90px;max-width:1240px;width:100%}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted)}
.mobile-top{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:18px;align-items:start}
.sticky{position:sticky;top:18px}

.btn{border:1px solid transparent;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;line-height:1.2;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.amber{background:var(--amber);color:#fff}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{border:0;background:transparent;cursor:pointer;padding:4px 8px;border-radius:8px;color:var(--muted);font-size:18px;line-height:1}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 11px;color:var(--ink);min-width:0}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:auto}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.n{background:var(--sunk);color:var(--muted)}
.tone{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:6px;font:700 12px var(--mono);color:#fff}
.tone.T{background:var(--t)} .tone.M{background:var(--m)} .tone.B{background:var(--b)}
.tone.TM{background:linear-gradient(90deg,var(--t) 50%,var(--m) 50%)} .tone.MB{background:linear-gradient(90deg,var(--m) 50%,var(--b) 50%)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.T{background:var(--t)} .dot.M{background:var(--m)} .dot.B{background:var(--b)}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.note{padding:10px 13px;border-radius:10px;background:var(--sunk);font-size:13px;color:var(--muted)}
.alert{padding:9px 12px;border-radius:10px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-bg);color:var(--warn)} .alert.bad{background:var(--bad-bg);color:var(--bad)} .alert.info{background:var(--sunk);color:var(--muted)}
.alert b{flex:none}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}
details.fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";color:var(--muted)} details.fold[open]>summary::after{content:"－"}

/* 首頁 */
.hello{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px 24px;background:var(--accent);color:var(--accent-ink);border-radius:18px;margin-bottom:16px;overflow:hidden;position:relative}
.hello h1{font-size:30px}
.hello p{margin:6px 0 0;opacity:.85}
.hello .btn{background:var(--surface);color:var(--ink)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:600 26px var(--mono)} .stat span{font-size:13px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick a{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);cursor:pointer}
.quick a:hover{border-color:var(--accent)}
.quick a b{font-family:var(--display);font-size:17px}
.quick a span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}

/* 調配台 */
.mode-bar{margin-bottom:14px}
.rows{display:flex;flex-direction:column;gap:8px}
.orow{display:grid;grid-template-columns:64px minmax(0,1fr) 84px 32px;gap:8px;align-items:center}
.orow select.tsel{padding:8px 6px;font-weight:700;font-family:var(--mono)}
.orow .stockmini{font-size:11px;color:var(--muted);grid-column:2/4;margin-top:-4px}
.pct-in{position:relative}.pct-in input{padding-right:24px;text-align:right}.pct-in.parts input{padding-right:30px}.pct-in.parts::after{content:"份"}.pct-in::after{content:"%";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}
.tmbbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.tmbbar i{display:block;height:100%}
.tmbbar .T{background:var(--t)} .tmbbar .M{background:var(--m)} .tmbbar .B{background:var(--b)}
.tmblegend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.tmblegend span{display:flex;gap:5px;align-items:center}

.label-card{background:var(--surface);border:1.5px solid var(--ink);border-radius:6px;padding:0;position:relative;box-shadow:var(--shadow)}
.label-card::before{content:"";position:absolute;inset:5px;border:1px solid var(--line);border-radius:3px;pointer-events:none}
.label-top{padding:16px 20px 12px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.label-top .kind{font-size:11px;letter-spacing:.2em;color:var(--amber);font-weight:700}
.label-top h3{font-size:21px;margin-top:2px}
.label-top .batch{font:500 11px var(--mono);color:var(--muted);text-align:right;line-height:1.5}
.label-big{display:flex;align-items:baseline;gap:8px;padding:12px 20px 4px}
.label-big b{font:600 44px var(--mono);line-height:1;color:var(--amber)}
.label-big span{color:var(--muted);font-size:13px}
.label-body{padding:6px 20px 16px}
.ln{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln .amt{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ln .amt small{display:block;color:var(--muted);font-size:11px}
.ln .nm small{display:block;font-size:11px;color:var(--muted)}
.ln.base .nm{color:var(--muted)}
.drops{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.drops i{width:6px;height:8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:block}
.label-foot{border-top:1.5px solid var(--ink);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}

/* AI */
.ai-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.thread{display:flex;flex-direction:column;gap:14px;min-height:240px}
.msg{max-width:92%}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:16px 16px 4px 16px}
.msg.ai{align-self:flex-start;display:flex;gap:10px}
.msg.ai .av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--amber-soft);display:grid;place-items:center}
.msg.ai .av svg{width:26px;height:26px}
.bubble{background:var(--surface);border:1px solid var(--line);padding:12px 15px;border-radius:4px 16px 16px 16px;white-space:pre-wrap}
.composer{display:flex;flex-direction:column;gap:10px;position:sticky;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.composer textarea{border:0;min-height:56px;padding:4px;background:transparent}
.composer textarea:focus{outline:none}
.fcard{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.fcard .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:3px}
.fcard .bar i{display:block;height:100%}
.thinking{display:inline-flex;gap:4px}.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* 精油庫 */
.oil-list{display:flex;flex-direction:column}
.oil-row{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,2fr) 90px 28px;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.oil-row:hover{background:var(--sunk)}
.oil-row .nm b{display:block} .oil-row .nm small{color:var(--muted);font-size:12px}
.oil-row .ar{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.star{border:0;background:none;cursor:pointer;font-size:18px;color:var(--line);padding:0}
.star.on{color:var(--amber)}
.kv{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* 庫存 */
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:30px;height:32px;cursor:pointer;font-weight:700}
.stepper input{border:0;border-radius:0;width:76px;text-align:right;padding:5px 6px;font-family:var(--mono)}
.tablewrap{overflow-x:auto}

/* 配方本 */
.rcard{display:flex;flex-direction:column;gap:10px}
.rcard .oils{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.rcard .oils span{display:inline-flex;align-items:center;gap:5px}
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:var(--amber)}

/* 視窗 */
.scrim{position:fixed;inset:0;background:rgba(15,22,18,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:var(--surface);border-radius:18px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:20px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dialog .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}

.bottom-nav{display:none}


@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 版面：自動（依螢幕）、強制手機版、強制電腦版 */
@media (max-width:980px){
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .split,:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .ai-wrap{grid-template-columns:1fr}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .sticky{position:static}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .shell{grid-template-columns:1fr}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .rail{display:none}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .mobile-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .mobile-top .brand svg{width:32px;height:32px}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) main{padding:16px 16px 96px}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .bottom-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;font-size:11px;color:var(--muted);text-decoration:none}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .bottom-nav a .ic{font-family:var(--display);font-size:19px;line-height:1.1}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .bottom-nav a[aria-current="page"]{color:var(--accent);font-weight:700}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .g2,:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .g3{grid-template-columns:1fr}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .shell{background:var(--bg)}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .hide-m{display:none}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .stepper input{width:56px}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .hello{grid-template-columns:1fr;padding:18px}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .hello h1{font-size:24px}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .oil-row{grid-template-columns:40px minmax(0,1fr) 70px 24px}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .oil-row .ar{display:none}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) .composer{bottom:76px}
:root:not([data-layout="desktop"]):not([data-layout="mobile"]) h2{font-size:20px}
}
:root[data-layout="mobile"] .split,:root[data-layout="mobile"] .ai-wrap{grid-template-columns:1fr}
:root[data-layout="mobile"] .sticky{position:static}
:root[data-layout="mobile"] .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
:root[data-layout="mobile"] .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
:root[data-layout="mobile"] .shell{grid-template-columns:1fr}
:root[data-layout="mobile"] .rail{display:none}
:root[data-layout="mobile"] .mobile-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
:root[data-layout="mobile"] .mobile-top .brand svg{width:32px;height:32px}
:root[data-layout="mobile"] main{padding:16px 16px 96px}
:root[data-layout="mobile"] .bottom-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
:root[data-layout="mobile"] .bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;font-size:11px;color:var(--muted);text-decoration:none}
:root[data-layout="mobile"] .bottom-nav a .ic{font-family:var(--display);font-size:19px;line-height:1.1}
:root[data-layout="mobile"] .bottom-nav a[aria-current="page"]{color:var(--accent);font-weight:700}
:root[data-layout="mobile"] .g2,:root[data-layout="mobile"] .g3{grid-template-columns:1fr}
:root[data-layout="mobile"] .shell{background:var(--bg)}
:root[data-layout="mobile"] .hide-m{display:none}
:root[data-layout="mobile"] .stepper input{width:56px}
:root[data-layout="mobile"] .hello{grid-template-columns:1fr;padding:18px}
:root[data-layout="mobile"] .hello h1{font-size:24px}
:root[data-layout="mobile"] .oil-row{grid-template-columns:40px minmax(0,1fr) 70px 24px}
:root[data-layout="mobile"] .oil-row .ar{display:none}
:root[data-layout="mobile"] .composer{bottom:76px}
:root[data-layout="mobile"] h2{font-size:20px}
:root[data-layout="mobile"] .shell{max-width:480px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
:root[data-layout="mobile"] .bottom-nav{max-width:480px;margin:0 auto}
.site-foot{margin-top:40px;padding:18px 0 4px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.site-foot .seg button{padding:5px 11px;font-size:13px}

/* 產品標籤 */
.plabel{border:2px solid var(--ink);border-radius:6px;padding:14px 16px;background:var(--surface);color:var(--ink);font-size:12px;line-height:1.5;max-width:520px}
.lb-head{display:flex;justify-content:space-between;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
.lb-brand{color:var(--amber);font-weight:700;font-size:12px;letter-spacing:.1em}
.lb-name{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2}
.lb-type{text-align:right;color:var(--muted);font-size:12px}.lb-type span{color:var(--ink);font:600 15px var(--mono)}
.lb-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;margin-bottom:4px}
.lb-row b{font-weight:700}
.lb-foot{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:11px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:grid!important;grid-template-columns:repeat(2,1fr);gap:6mm;padding:0}
  #print-area .plabel{break-inside:avoid;max-width:none;background:#fff;color:#000;border-color:#000}
  #print-area .lb-brand{color:#8a4a12}
  @page{size:A4;margin:10mm}
}

/* 庫存剩量條 */
.inv-list{display:flex;flex-direction:column}
.inv-item{border-bottom:1px solid var(--line)}
.inv-item.open{background:var(--sunk);border-radius:10px;border-bottom-color:transparent;margin:2px 0}
.inv-main{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 54px;gap:14px;align-items:center;padding:11px 10px;cursor:pointer;border-radius:10px}
.inv-main:hover{background:var(--sunk)}
.inv-main:focus-visible{outline:2px solid var(--amber)}
.inv-nm b{display:block}.inv-nm small{display:block;color:var(--muted);font-size:12px}
.inv-bar{display:flex;align-items:center;gap:10px}
.meter{flex:1;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;min-width:60px;box-shadow:inset 0 0 0 1px var(--line)}
.meter i{display:block;height:100%;border-radius:999px}
.meter i.ok{background:var(--m)} .meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.inv-amt{white-space:nowrap;font-size:14px;min-width:150px;text-align:right}
.inv-main .pill{justify-self:end}
.inv-edit{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:4px 10px 14px}
@media (max-width:760px){:root:not([data-layout="desktop"]) .inv-main{grid-template-columns:minmax(0,1fr) 54px;gap:6px 10px}:root:not([data-layout="desktop"]) .inv-bar{grid-column:1/-1;grid-row:2}}
:root[data-layout="mobile"] .inv-main{grid-template-columns:minmax(0,1fr) 54px;gap:6px 10px}:root[data-layout="mobile"] .inv-bar{grid-column:1/-1;grid-row:2}
[hidden]{display:none!important}

風寒型肌肉緊繃舒緩、自然香氛營造清新環境。","emotion":"帶來「清爽醒腦」、「從混亂返回清明」的感受。","tags":["放鬆","淨化"],"aliases":["蓝雲杉"]},{"id":"blue-tansy","name":"藍艾菊","en":"Blue Tansy","part":"整株","tone":"M","drops":"1-2","aroma":"花草甜＋微樟木＋藥草底","body":"適合肌膚紅癢、微發炎、敏感部位的鎮定護理","emotion":"其獨有的藍色與草藥感帶來「療癒、轉化」的氛圍，當你需要進入深度內在、釋放情緒的時候比較適合。","tags":[],"aliases":["蓝艾菊"]},{"id":"cardamom","name":"荳蒄","en":"Cardamom","part":"種子","tone":"T","drops":"4","aroma":"溫暖、辛香、甜、微木質調","body":"可舒緩消化系統（噁心、旅途暈車、腸胃氣脹）","emotion":"香氣甜辣溫暖，有提振精神、舒緩壓力、使人覺得振奮與清醒的作用。香調為溫暖辛香中帶甜香。","notes":"在調香中常與木質、花香、香料調合，增添深度。","tags":["放鬆"]},{"id":"carrot-seed","name":"胡蘿蔔種子","en":"Carrot Seed","part":"種子","tone":"M/B","drops":"6","aroma":"土質、微甜、草本底蘊＋輕微木質","body":"抗氧化、抗菌、抗真菌、保護皮膚、可作為輔助防曬成分（但不能替代防曬霜）","emotion":"香氣略帶土味、溫暖能量，有助於放鬆、靜心、浄化感覺。","warning":"孕婦、哺乳期建議避免使用，可能造成子宮收縮。皮膚敏感者亦需小心，易引起光敏感","tags":["保護","放鬆","淨化"],"aliases":["胡蘿萄種子"]},{"id":"cedarwood","name":"雪松","en":"Cedarwood","part":"木材／樹幹木頭","tone":"B","drops":"7-8","aroma":"木質、溫潤，在靜坐、冥想、睡前擴香特別推薦","body":"抗菌、抗皮膚感染、幫助頭皮與掉髮、提振髮根、支持呼吸道","emotion":"深沉、穩定、安定情緒、減少焦躁、提供根基感與自信。","tags":["財富","保護","放鬆","睡眠","淨化"]},{"id":"celery-seed","name":"芹菜種子","en":"Celery Seed","part":"種子","tone":"M","drops":"3","aroma":"草本、微辛香、種子香、帶地草感","body":"據部分草本資料種子油具利尿、排毒、改善腎／肝功能潛力。","emotion":"香氣較細膩、草本帶辛味，有助於清醒、淨化情緒。","tags":["淨化"]},{"id":"cinnamon-bark","name":"肉桂","en":"Cinnamon Bark","part":"內樹皮","tone":"M","drops":"1","aroma":"辛香、甜香、木質＋香料感","body":"抗菌、抗真菌、溫暖肌肉／關節、促進循環、暖身。","emotion":"溫暖、辛香，能激發活力、提升心情、驅除寒意／沈鬱情緒。","warning":"因為非常強效、刺激，用量應極少，使用時請確保良好稀釋，避免灼傷皮膚","tags":["保護","淨化"]},{"id":"citronella","name":"香茅","en":"Citronella","part":"葉／草莖","tone":"T/M","drops":"3","aroma":"草本、清新、檸檬香調、少許辛香","body":"驅蟲、防蚊、淨化空氣、提神醒腦。","emotion":"清新、提振、淨化思緒、改善疲憊感。","notes":"在室內環境、夏季蚊蟲多時常用。","tags":["保護","淨化"]},{"id":"clary-sage","name":"快樂鼠尾草","en":"Clary Sage","part":"葉與花蕾／花朵","tone":"M","drops":"3","aroma":"草本、微花香、略甜、淡木質","body":"可緩解月經不適、平衡荷爾蒙、抗痙攣、紓緩壓力。","emotion":"情緒平衡、減壓、放鬆身心、提升愉悅感。","notes":"女性身心課題／經期、情緒起伏時常用。","tags":["放鬆"]},{"id":"clove","name":"丁香","en":"Clove","part":"花蕾","tone":"M","drops":"2-3","aroma":"辛香、甜香、香料味、微木質","body":"強效抗菌、抗真菌、止痛（如牙痛）、促進血液循環。","emotion":"提振、喚醒感官、增強意志與專注，亦有暖心作用。","warning":"因辛熱、刺激性高，用量極少，孕婦、小兒、敏感肌膚、黏膜處使用要非常慎重。","notes":"常與肉桂、薑、橙香合用於「溫暖香氛」。","tags":["愛情","保護","淨化"]},{"id":"copaiba","name":"苦配巴","en":"Copaiba","part":"樹脂","tone":"B","drops":"3","aroma":"木質、樹脂、稍甜、地質感／暖香","body":"抗炎、止痛、促進傷口癒合、舒緩關節／肌肉不適、支援呼吸系統。","emotion":"深沉木質／樹脂香氣使人感到安心、穩定、舒緩焦慮。","notes":"作為基底精油非常理想，可在香氛中增加持香與深度。","tags":["放鬆"]},{"id":"coriander","name":"芫荽","en":"Coriander","part":"種子","tone":"M","drops":"5-6","aroma":"草本＋辛香＋木質尾韻，帶甜辣與果香調","body":"促進消化、緩解肌肉／關節不適、淨化肌膚、提升循環。","emotion":"香氣帶有溫暖辛香、提振精神、幫助專注與清醒。","tags":["淨化"]},{"id":"cypress","name":"絲柏","en":"Cypress","part":"針葉","tone":"M","drops":"5","aroma":"木質香 + 草本／樹葉香，較「清新木質」為主","body":"促進血液循環、支援呼吸道、改善水腫、舒緩肌肉緊張。","emotion":"香氣清新木質、帶針葉氛圍，有助於內在靜定、清醒思考、穩定情緒。","tags":["放鬆"]},{"id":"dill","name":"蒔蘿","en":"Dill","part":"葉莖花或種子","tone":"M","drops":"2","aroma":"草香 + 辛香 + 清新綠葉香","body":"支援消化系統、舒緩胃腸不適、輕度神經放鬆。","emotion":"香氣為草本、微辛香，適合神經緊張、思緒紊亂時使用。","tags":["放鬆"]},{"id":"dorado-azul","name":"山香","en":"Dorado Azul","part":"葉／樹幹","tone":"M/B","drops":"4","aroma":"木質＋微樹脂調＋帶清新劑感","body":"支援呼吸道、可能具荷爾蒙平衡作用。","emotion":"香氣獨特、具轉化力，適合深層釋放、內在轉化。","tags":[]},{"id":"elemi","name":"欖香脂","en":"Elemi","part":"樹脂","tone":"M","drops":"4-5","aroma":"木質＋樹脂香＋微辛柑橘調","body":"支援肌膚再生、紓緩肌肉／關節疲勞、呼吸系統支援。","emotion":"香氣具穩定作用，有助於冥想、焦慮時刻的安定。","tags":["放鬆"],"aliases":["榄香脂"]},{"id":"eucalyptus-blue","name":"藍膠尤加利","en":"Eucalyptus Blue","part":"葉","tone":"T/M","drops":"5","aroma":"清新木質＋藥草／涼感","body":"支援呼吸道通暢、清潔作用、提振疲勞。","emotion":"香氣清涼、具有醒腦、清淨感。","tags":["淨化"],"aliases":["蓝膠尤加利"]},{"id":"eucalyptus-globulus","name":"特級尤加利","en":"Eucalyptus globulus","part":"葉","tone":"T/M","drops":"4","aroma":"涼感藥草＋木質＋清新氣息","body":"強效支持呼吸道、抗菌／清潔作用、肌肉疼痛支援。","emotion":"醒腦、清晰思緒、適合使用於需要振奮或換氣時刻。","tags":["保護","淨化"],"aliases":["特级尤加利"]},{"id":"eucalyptus-radiata","name":"尤加利","en":"Eucalyptus radiata","part":"葉","tone":"T/M","drops":"4","aroma":"清新藥草＋木質＋微涼感","body":"支援呼吸道、清潔作用。","emotion":"清新清醒、提升專注、換氣／換念時刻適用。","tags":["淨化"]},{"id":"fennel","name":"茴香","en":"Fennel","part":"種子","tone":"M","drops":"3-4","aroma":"草本＋甜香＋微藥草／香草調","body":"支持消化系統、調理腸胃、利尿、排毒。","emotion":"香氣甜中帶草本／甘香，有助於釋放壓力、舒緩情緒。","tags":["放鬆","淨化"]},{"id":"frankincense","name":"乳香","en":"Frankincense","part":"樹脂","tone":"B","drops":"4-5","aroma":"樹脂香＋木質香＋微香甜／溫暖調","body":"支援免疫系統、肌膚再生、減緩發炎、深層放鬆。","emotion":"香氣沉穩、冥想／靜心好助手，有助於內在平靜與靈性連結。","tags":["保護","放鬆"]},{"id":"galbanum","name":"白松香","en":"Galbanum","part":"樹脂","tone":"M/B","drops":"5","aroma":"草本 + 樹脂＋木質調","body":"有助於支援呼吸系統、淨化作用、皮膚保養。","emotion":"獨特草本／樹脂香氣，有助於釋放壓抑、促進內在覺醒。","tags":["淨化"]},{"id":"geranium","name":"天竺葵","en":"Geranium","part":"葉及花","tone":"M","drops":"3","aroma":"花香 + 草本＋微甜／香料調","body":"平衡皮脂、支持肌膚健康、改善循環與水腫。","emotion":"香氣柔和花香、舒緩焦慮、提升情緒穩定與自信。","tags":["財富","放鬆"]},{"id":"german-chamomile","name":"德國洋柑橘","en":"German Chamomile","part":"花","tone":"M/B","drops":"1","aroma":"草本＋花香＋微蘋果／甜調","body":"鎮靜／舒緩肌膚紅腫、緊張、幫助睡眠。","emotion":"非常適合焦慮、失眠、壓力大時使用，有助於平靜與釋放。","tags":["放鬆","睡眠"]},{"id":"ginger","name":"生薑","en":"Ginger","part":"根莖","tone":"M","drops":"4","aroma":"辛香 + 根茎香 + 微木質／暖調","body":"促進血液循環、緩解消化不適、提高體溫、緩解肌肉僵硬。","emotion":"香氣溫暖辛香，有助於振奮、驅除疲乏、喚醒意志。","tags":[]},{"id":"balsam-of-peru","name":"秘魯香脂","en":"Balsam of Peru","part":"樹脂","tone":"B","drops":"2","aroma":"樹脂香＋甜暖香＋木質／香脂調","body":"常用於香氛配方、皮膚調理、支援呼吸系統／淨化。","emotion":"香氣溫暖、濃郁、帶安定及懷舊感，適合夜間或靜修時使用。","tags":["放鬆","淨化"],"aliases":["秘鲁香脂"]},{"id":"benihi","name":"紅檜","en":"Benihi","part":"木質部","tone":"M/B","drops":"2","aroma":"溫潤木質＋森林氣息＋輕土壤","body":"肌膚安定、營造清新空氣氛圍、支援呼吸道的「森林感」舒適。","emotion":"香氣帶來沉穩與安定，可用於冥想、靜心、書寫或內在整合的時刻，協助從外在轉為內在適合情緒浮動、思緒紊亂、需要內在回歸時使用。","tags":["放鬆","淨化"],"aliases":["檜木"]},{"id":"goldenrod","name":"加拿大一枝黃花","en":"Goldenrod","part":"花或全草","tone":"M","drops":"1","aroma":"草香 + 花香 + 微木質調","body":"傳統用於支援泌尿系統／淋巴系統，改善水腫、促進排水。","emotion":"香氣較為柔和、草本清新，有助於釋放壓力、舒緩雜念。","tags":["放鬆"],"aliases":["加拿大一枝黄花"]},{"id":"grapefruit","name":"葡萄柚","en":"Grapefruit","part":"果皮","tone":"T","drops":"8","aroma":"果香、清甜","body":"促進循環、排水腫、淨化肝臟與代謝。","emotion":"提振快樂與動能，釋放沉重情緒。","notes":"與雪松或杜松並用可強化淨化與提振作用","tags":["淨化"]},{"id":"helicrysum","name":"蠟菊","en":"Helicrysum","part":"花朵","tone":"M/B","drops":"5","aroma":"花草甜香","body":"消炎、抗瘀血、促進組織修復。","emotion":"協助原諒、放下與內在療癒。","notes":"高價珍稀油，常被稱為「靈魂再生之油」。","tags":[]},{"id":"hyssop","name":"牛膝草","en":"Hyssop","part":"花與葉","tone":"M","drops":"3","aroma":"草本、微辛，藥草氣息濃郁，帶有潔淨感","body":"清肺、化痰、增強免疫。","emotion":"清理思緒，驅散恐懼與自我懷疑。","notes":"屬靈性淨化用油，可用於空間能量清理。","tags":["保護","淨化"]},{"id":"jasmine","name":"茉莉","en":"Jasmine","part":"花朵","tone":"M/B","drops":"1","aroma":"花香、甜潤，香氣濃郁甜美、富有女性魅力","body":"調節荷爾蒙、舒緩經痛、助眠與放鬆。","emotion":"開啟愛與自信，喚醒心輪。","notes":"與檀香或雪松搭配，可增深厚度與柔和餘韻。","tags":["財富","愛情","放鬆","睡眠"]},{"id":"juniper","name":"杜松","en":"Juniper","part":"果實","tone":"M","drops":"4","aroma":"木質、味道像高山上的空氣，清涼、帶著乾淨的樹脂氣","body":"利尿排毒、消除水腫、肝膽淨化、淨化氣場、清除負能量","emotion":"它是淨化者，能清除身體與能量場的濁氣。每當壓力或焦慮太重，杜松會像森林的風，帶走雜念，讓你重新呼吸。","notes":"懷孕或腎病者避免使用","tags":["放鬆","淨化"]},{"id":"lauris-nobilis-bay-laurel","name":"月桂樹","en":"Lauris Nobilis \n(Bay Laurel)","part":"葉","tone":"M","drops":"2-4","aroma":"聞起來帶著草本與辛香","body":"強化免疫、祛痰抗病毒","emotion":"激發勇氣、強化表達、提振思緒、喚醒直覺，給予信心與行動力，適合在需要領導、發言、登場時使用。","notes":"高濃度刺激皮膚，勿過量","tags":["財富","保護"],"aliases":["月桂"]},{"id":"lavender","name":"薰衣草","en":"Lavender","part":"花","tone":"M","drops":"7","aroma":"花香、草本清新","body":"鎮靜安神、助眠、放鬆肌肉","emotion":"溫柔的守護者。像一條薄毯，平衡心緒、心輪調和、安撫焦慮不安。無論是頭痛、失眠或情緒起伏，皆能帶來穩定的平衡","notes":"無明顯禁忌，最安全的萬用油","tags":["愛情","放鬆","睡眠"],"aliases":["高山薰衣草"]},{"id":"ledum","name":"杜香","en":"Ledum","part":"葉與花","tone":"B","drops":"4","aroma":"草本氣味，藥草調，帶有濕潤的土氣與藥草味，聞起來略帶野性","body":"肝臟排毒、抗發炎、平衡免疫","emotion":"釋放肝火與情緒毒素，是內在「排毒」的導師，有一種能讓靈魂靜下來的深沉力量。放下控制、進入深層療癒","notes":"濃度過高可能嗆喉，建議低比例使用","tags":["保護","淨化"]},{"id":"lemongrass","name":"檸檬香茅","en":"Lemongrass","part":"葉","tone":"T/M","drops":"1","aroma":"清新又帶點辛辣，像一把風掃過整個空間","body":"驅除雜氣、防蟎除臭，抗菌、防蟎、除臭、促循環。它有「清理能量場」的力量，噴上後空間會變得乾淨清亮。","emotion":"能迅速喚醒疲憊的思緒，提振專注力、清理能量場","notes":"皮膚刺激性高，濃度勿超2%","tags":["保護","淨化"]},{"id":"lemon","name":"檸檬","en":"Lemon","part":"果皮","tone":"T","drops":"6-7","aroma":"果香，它是最單純的快樂香氣，太陽的孩子。明亮、乾淨、充滿喜悅","body":"它能淨化血液，讓頭腦清醒，淨化血液、提神、抗菌清理腦霧","emotion":"驅散憂鬱，讓心情清新明亮，提升正向思維，提醒人：幸福有時就是一口新鮮的呼吸。","notes":"光敏性，避免日曬","tags":["保護","淨化"]},{"id":"lime","name":"萊姆／青檸","en":"Lime","part":"果皮","tone":"T","drops":"3","aroma":"果香、酸甜清脆、酸中帶甜，像是年輕版的檸檬，更俏皮","body":"它讓人精神振奮，解油膩、清理消化系統","emotion":"快樂、青春、重啟創造力。當生活變得太嚴肅，萊姆會讓氣氛重新變得輕盈","notes":"光敏性，避免日曬","tags":["財富","淨化"]},{"id":"manuka","name":"麥盧卡","en":"Manuka","part":"葉與樹枝","tone":"M/B","drops":"5","aroma":"木質、藥草甜香，大地的醫者。它氣味厚實，帶著木質與甜草香","body":"護膚、抗菌、消炎抗病毒、修復皮膚","emotion":"在能量上帶來「自我價值感」的重建。提升自我價值感、清理情緒創傷，當你覺得被世界削弱、失去自信時，麥盧卡會讓你重新記起：你本來就足夠。","notes":"濃度高易黏稠，與花香調配柔化效果佳","tags":["財富","保護","淨化"]},{"id":"marjoram","name":"馬鬱蘭","en":"Marjoram","part":"花","tone":"M","drops":"3","aroma":"草本、溫暖、略帶辛甜","body":"放鬆肌肉、改善睡眠、舒緩痙攣與經痛，支持神經系統平衡","emotion":"帶來柔和的安全感與「被擁抱」的氛圍，能安撫孤單與焦慮，又被稱為「幸福之油」，在情緒低落或關係療癒時極具效果。","tags":["放鬆","睡眠"]},{"id":"mastrante","name":"白棘枝","en":"Mastrante","part":"葉與花頂","tone":"M","drops":"1","aroma":"柔和草本中帶微甜，略似廣藿香但更乾淨輕盈。","body":"抗發炎、鎮痛、放鬆肌肉緊繃，協助睡眠與呼吸調節。","emotion":"讓人放慢步調、靜下心，減輕過度思考的疲憊。","tags":["放鬆","睡眠"]},{"id":"melissa","name":"香蜂草","en":"Melissa","part":"葉與花頂","tone":"M","drops":"1","aroma":"清甜檸檬草調中帶花香，明亮而細膩。","body":"鎮靜心跳、穩定血壓、抗病毒、平衡消化系統。","emotion":"帶來希望與輕盈，安撫焦慮與悲傷，是「微笑的太陽油」。讓人重拾信任與生命的溫度。","notes":"稀釋後使用，濃度不超 0.5%","tags":["保護","放鬆"]},{"id":"myrrh","name":"沒藥","en":"Myrrh","part":"樹脂","tone":"B","drops":"5-6","aroma":"樹脂木質調，溫暖厚重、略帶煙燻感。","body":"抗炎、抗菌、促進傷口癒合，支援呼吸系統與免疫力。","emotion":"幫助靜心與冥想，放下悲傷與焦慮，使人回到安定與臣服狀態。","notes":"古埃及祭祀香料之一，象徵靈魂回歸與淨化。與乳香搭配，是強效的靈性修復配方。","tags":["保護","放鬆","淨化"]},{"id":"myrtle","name":"香桃木","en":"Myrtle","part":"葉與枝","tone":"M","drops":"6","aroma":"清新草木中帶花香調，潔淨明亮。","body":"清肺祛痰、調理呼吸道、抗菌除臭。","emotion":"帶來純淨與輕盈，淨化能量場，讓人恢復呼吸的自由感。","notes":"對應喉輪，有助真誠表達與清晰思緒，適合講師、溝通者使用。","tags":["保護","淨化"]},{"id":"neroli","name":"橙花","en":"Neroli","part":"花","tone":"M","drops":"2-3","aroma":"花香中帶淡淡苦橙調，清甜而高貴","body":"鎮靜神經、緩解焦慮與失眠、促進皮膚修復、改善循環。","emotion":"橙花象徵純淨與重生，是「心輪之花」。穩定情緒，帶來柔和的幸福與被愛感。常用於釋放緊張與恢復女性能量。","notes":"與佛手柑、檀香並用極為柔順。","tags":["愛情","放鬆","睡眠"]},{"id":"melaleuca-quinquenervia","name":"綠花白千層","en":"Melaleuca quinquenervia","part":"葉與枝","tone":"M","drops":"4","aroma":"草本、微樟香、清新乾淨。","body":"抗菌、抗病毒、清肺與強化免疫。","emotion":"淨化能量場，清理思緒與雜氣，使人頭腦清明。","notes":"喉輪與眉心輪的清理能量，適用於儀式或空間清潔。","tags":["愛情","保護","淨化"]},{"id":"nutmeg","name":"肉荳蒄","en":"Nutmeg","part":"種子","tone":"M/B","drops":"2-3","aroma":"辛甜、溫暖、略帶煙燻木香。","body":"促進血液循環、溫暖身體、舒緩肌肉酸痛。","emotion":"激勵鬥志、驅散倦怠，喚醒內在行動力與創造欲。","notes":"適合寒冷或能量低落時使用，增添動能與熱度。","tags":["財富","放鬆"]},{"id":"onycha","name":"安息香","en":"Onycha／Benzoin resinold","part":"樹脂","tone":"B","drops":"1／3","aroma":"濃厚香脂、甜中帶煙氣。\n甜潤溫暖，帶香草與焦糖氣息，像一條柔軟的毛毯。","body":"鎮靜、抗菌、潤膚，對皮膚乾裂特別有幫助。\n潤肺止咳、舒緩乾燥與皮膚龜裂，常被用於護手霜與按摩油。它還能放鬆肌肉、鎮定心律，幫助身體釋放緊張。","emotion":"助情感釋放與深層療癒，安撫靈魂創傷。\n是「情緒安撫」的香氣。能撫平悲傷與孤單感，帶來被包覆的溫度。適合冬夜、哀傷、失眠與冥想時使用。","notes":"靈性沉香系的定香能量油。\n象徵「慈悲與溫柔」。在能量層中屬於安撫與修復頻率，可搭配乳香或玫瑰創造深層慰藉感。","tags":["保護","放鬆","睡眠","淨化"]},{"id":"orange","name":"甜橙","en":"Orange／Sweet orange","part":"果皮","tone":"T","drops":"7／6","aroma":"甜美果香、明亮柔和。\n香氣飽滿柔和，溫暖親切。","body":"促進消化、緩解緊繃、幫助入眠。\n放鬆神經、改善腸胃功能、促進血液循環、提振免疫力。","emotion":"帶來喜悅與放鬆，是快樂能量的最佳代表，能喚醒童心與玩心。\n「幸福頻率之油」，能喚醒微笑、融化緊張。它提醒我們：「輕鬆，也是一種力量。」","notes":"是療癒低氣壓與心悶的陽光之油。\n象徵「快樂與滋養」。非常適合家庭與兒童空間使用，帶來溫暖氛圍。","tags":["保護","放鬆"]},{"id":"oregano","name":"牛至","en":"Oregano","part":"葉與花頂","tone":"M/B","drops":"5","aroma":"濃烈辛香、藥草氣息強。","body":"強力抗菌、抗病毒、支援免疫系統。","emotion":"清除負能量、提升勇氣，適合需要強勢界線的人使用，屬於火元素能量，象徵決斷與行動。","notes":"僅限極低劑量使用，按摩濃度不超 0.5%","tags":["財富","保護","淨化"]},{"id":"palmarosa","name":"玫瑰草","en":"Palmarosa","part":"草葉","tone":"M","drops":"5-6","aroma":"甜潤花草香，帶微微玫瑰氣息。","body":"保濕、抗菌、修復肌膚、平衡油脂分泌。","emotion":"柔軟而寧靜，安撫焦慮與孤單感，帶來心靈的溫度。","notes":"心輪能量之油，象徵「愛與自我照顧」，適合搭配薰衣草與橙花共用。","tags":["愛情","保護","放鬆","淨化"]},{"id":"palo-santo","name":"秘魯聖木","en":"Palo Santo","part":"倒木木材","tone":"M/B","drops":"3-4","aroma":"木質、煙燻、帶有微甜與柑橘底韻。","body":"抗菌、鎮靜神經、支援呼吸與免疫系統。","emotion":"強化能量場、驅散低頻與焦慮，是「靈性潔淨」與冥想時的保護能量。","notes":"又稱「聖木」，被南美薩滿用於淨化與祈禱。與雪松、乳香、岩蘭草共調，可創造穩定而神聖的氣場。","tags":["保護","放鬆","睡眠","淨化"],"aliases":["秘鲁聖木"]},{"id":"patchouli","name":"廣藿香","en":"Patchouli","part":"葉片","tone":"B","drops":"4","aroma":"濕潤土氣、木質厚重、帶煙甜韻。","body":"促進循環、抗炎、改善皮膚鬆弛。","emotion":"接地、穩定、增強安全感與現實行動力，讓人腳踏實地，重新與物質世界連結。","tags":["財富","放鬆"]},{"id":"peppermint","name":"歐薄荷","en":"Peppermint","part":"葉","tone":"T","drops":"1-2","aroma":"清涼、辛薄荷香氣強烈。","body":"提神、清頭腦、舒緩頭痛、促進消化。","emotion":"清醒、專注、理智，幫助整理混亂思緒。","notes":"對應喉輪與眉心輪，是「清晰決斷」的氣場之油。","tags":["愛情","放鬆"]},{"id":"petitgrain","name":"苦橙葉","en":"Petitgrain","part":"嫩枝與葉","tone":"M","drops":"5-6","aroma":"清新花木調，融合花香與綠葉氣息。","body":"鎮靜神經、平衡情緒、幫助入眠。","emotion":"帶來溫柔安定的力量，減輕緊張與壓力。","notes":"心輪之油，像是橙花的弟弟，溫和卻深具療癒力。","tags":["愛情","放鬆","睡眠"]},{"id":"pine","name":"松樹","en":"Pine","part":"針葉與枝","tone":"M","drops":"6","aroma":"乾淨木質調，帶森林氣息。","body":"強化免疫、清肺抗菌、提振呼吸道。","emotion":"恢復清新感與堅毅力，幫助排除疲憊氣息，恢復自我內在力量。","tags":["保護","淨化"]},{"id":"ravintsara","name":"羅文沙葉","en":"Ravintsara","part":"葉","tone":"M","drops":"5","aroma":"清新草本帶微樟香。","body":"強效抗病毒、抗菌、提振免疫與呼吸。","emotion":"清潔氣場、穩定思緒，是精神疲倦時的再生能量。","notes":"眉心輪之油，有助專注與靜心，是「呼吸與覺知」的調整者。","tags":["愛情","保護","放鬆","淨化"]},{"id":"roman-chamomile","name":"羅馬洋甘菊","en":"Roman Chamomile","part":"花","tone":"M","drops":"1","aroma":"柔和果香花香，帶蘋果甜韻。","body":"鎮靜神經、舒緩焦慮、緩解經痛與腸胃不適。","emotion":"帶來寧靜與安撫，幫助釋放壓力、溫柔表達，像母親般的擁抱。","tags":["放鬆","睡眠"]},{"id":"rose","name":"玫瑰","en":"Rose","part":"花","tone":"M","drops":"1","aroma":"濃郁花香、甜潤高雅、帶柔滑粉感。","body":"調節荷爾蒙、滋潤肌膚、助眠、舒緩經期不適。對心臟與循環系統有穩定作用，亦能平衡女性生理週期。","emotion":"打開心輪、帶來愛與寬恕，治癒情感創傷。適合在情緒受傷、缺乏自我價值時使用，讓人重新相信愛的可能。","notes":"心輪之王，象徵「無條件的愛」。玫瑰的頻率極高（約 320 MHz），是靈性療癒與情感復甦最溫柔的守護油。","tags":["愛情","放鬆","睡眠"]},{"id":"rosemary","name":"迷迭香","en":"Rosemary","part":"葉與花","tone":"M","drops":"4-5","aroma":"清新草本、微樟木氣息、明亮提神。","body":"促進循環、提神醒腦、強健記憶力、改善頭皮與落髮狀況。可活化肝功能與新陳代謝。","emotion":"清晰頭腦、提升專注力與決斷力，驅散遲鈍與混亂。適合學習、工作或演講前使用，能喚醒潛能與自信。","tags":["財富"],"aliases":["迷选香"]},{"id":"sacred-frankincense","name":"神聖乳香","en":"Sacred Frankincense","part":"樹脂","tone":"M/B","drops":"4-5","aroma":"木質、樹脂、微甜煙香，帶靜謐神聖感。","body":"抗炎、促進細胞再生、強化免疫系統，對呼吸道與皮膚再生效果極佳。","emotion":"穩定心靈、清理能量場，開啟內在智慧與直覺。能協助進入深層冥想與祈禱狀態。","notes":"象徵「神聖連結」。常用於靈修、祈禱、冥想與儀式中，被譽為「通往高我之橋」。","tags":["保護","放鬆","淨化"]},{"id":"sage","name":"鼠尾草","en":"Sage","part":"葉","tone":"M/B","drops":"4-5","aroma":"草本、辛香、略帶乾燥木氣。","body":"抗菌、調理荷爾蒙、促進循環、改善消化與呼吸系統。","emotion":"清理負能量與情緒殘留，幫助放下舊有信念與執著，是「能量重啟」之油。","notes":"象徵「智慧與覺醒」。在薩滿傳統中被視為淨化與保護空間的神聖草本。","tags":["保護","淨化"]},{"id":"sandalwood-royal-hawaiian","name":"皇家夏威夷檀香","en":"Sandalwood\n (Royal Hawaiian)","part":"木","tone":"B","drops":"6","aroma":"溫潤木質、奶香柔和，帶靜謐甜感。","body":"鎮靜心神、抗炎、滋潤皮膚、助眠。","emotion":"帶來寧靜與神聖感，連結內在靈性與智慧。","notes":"象徵「靜心與慈悲」。是冥想與能量香水中最常見的靈性基調。","tags":["睡眠"],"aliases":["檀香"]},{"id":"litsea-cubeba","name":"山雞椒","en":"Litsea cubeba","part":"果實","tone":"T/M","drops":"4","aroma":"清爽明亮的柑橘香中混合一絲草本辛甜氣息，像黎明前的陽光劃開濃霧。","body":"強效抗菌與抗發炎精油，能淨化空氣、促進循環、提振代謝，也能幫助油性肌膚與痘痘肌恢復平衡。其氣味中的檸檬醛成分能清理呼吸道、提升氧氣吸收，讓人精神集中又不緊繃。","emotion":"「晨光之油」，可在心情低落時喚起希望與快樂。它能掃除思緒中的雜塵，讓人感受到潔淨、明朗與自由。非常適合在新計畫啟動前或想轉化低頻時使用。","notes":"象徵「喜悅與覺醒」。在能量層中屬於清理與提振的高頻光體香氣，常被用於開啟新篇章的儀式。","tags":["保護","淨化"]},{"id":"spearmint","name":"綠薄荷","en":"Spearmint","part":"葉","tone":"T","drops":"2-3","aroma":"清涼薄荷中帶甜意，比胡椒薄荷柔和許多，像春風拂過臉頰。","body":"能幫助消化、清新口氣、緩解噁心感與頭暈，同時舒緩肌肉緊繃與頭痛。綠薄荷富含香芹酮，對呼吸道有放鬆效果，適合長時間用腦或需要專注時使用。","emotion":"能量像清晨微笑的風，能驅散沉悶與煩躁，使人重新感覺清爽與輕盈。它帶來柔和的清醒，不是突兀的刺激，而是一種「我準備好迎接今天」的平衡感。","notes":"喉輪與眉心輪之油，象徵「清晰與真誠表達」。能量頻率高而純淨，適合用於言語療癒、教學或公開演說前，幫助語言流暢與氣場穩定。","tags":["愛情","放鬆"]},{"id":"spikenard","name":"穗甘松","en":"Spikenard","part":"根部","tone":"B","drops":"1-2","aroma":"濕潤厚重的草根香，略帶泥土與苔蘚氣息，像雨後森林深處的呼吸。","body":"以鎮靜與助眠著稱，可降低焦慮、穩定血壓與心跳。它有助於調整自律神經，讓身體恢復自然節奏。亦可用於按摩腳底或背部，以幫助深層放鬆。","emotion":"香氣深沉如大地懷抱，是極具「臣服」能量的香氣。當人陷於悲傷、焦慮或不安時，穗甘松像母親一樣將靈魂包裹，溫柔地讓你記起：「你被大地承接著。」","notes":"「靈魂歸根」的能量油。古代修行者常在祈禱與冥想中使用它，以協助靜心、連結內在與天地頻率。","tags":["放鬆","睡眠"]},{"id":"tangerine","name":"紅橘","en":"Tangerine","part":"果皮","tone":"T","drops":"7","aroma":"甜潤多汁的果香中帶細緻花氣，彷彿午後陽光灑在橘園裡的微笑。","body":"能幫助放鬆神經、改善睡眠品質，緩解腸胃脹氣與消化不良。它的成分富含檸烯，能提升免疫力與皮膚淨化作用。晚上泡澡時加幾滴柑橘，能讓身體釋放壓力、入睡更深沉。","emotion":"「快樂的內在小孩之油」。溫暖、陽光、甜美，能融化心中的冷漠與緊張，讓人重新擁抱生活的可愛。特別適合憂鬱、焦慮或對生活失去熱情時使用。","notes":"柑橘的頻率輕盈卻極具療癒力，能開啟創作靈感與人際溫度，是「讓靈魂微笑」的香氣。","tags":["愛情","保護","放鬆","睡眠","淨化"]},{"id":"tarragon","name":"龍蒿","en":"Tarragon","part":"葉與花頂","tone":"M","drops":"3-4","aroma":"清新草本帶辛香氣息，微涼中透出淡淡甜意，乾淨而有力量。","body":"幫助腸胃蠕動、舒緩脹氣與經期痙攣。它具有天然的抗發炎與鎮痛功效，對於緊繃的神經與肌肉僵硬也有放鬆作用。","emotion":"氣味有一種「鬆開執著」的力量。當思緒卡住、情緒堆積或被壓抑時，它能幫助鬆動能量結構，讓心重新變得柔軟與有彈性。","notes":"「釋放控制與恢復流動」。教會我們在力量與柔軟之間找到平衡，是勇敢又溫和的療癒能量。","tags":["放鬆"]},{"id":"tea-tree","name":"茶樹","en":"Tea Tree","part":"葉","tone":"M","drops":"3-4","aroma":"草本清新中帶樟木調，乾淨、純粹、帶少許藥草氣。","body":"最經典的抗菌抗病毒精油，能快速淨化傷口、改善皮膚炎與痘痘問題，亦可舒緩呼吸道不適。它像一位嚴謹的守護者，幫助身體恢復防禦力。","emotion":"能量乾淨明亮，有強大的「界線」頻率。當人情緒受到污染、能量被吸取或環境混濁時，茶樹能幫你切斷負連結，重啟清晰與獨立。","notes":"喉輪與眉心輪共振之油，象徵「清理、界線與覺醒」。它是一種「潔淨真理」的力量，提醒人回到真實、自我與光。","tags":["愛情","保護","放鬆","淨化"]},{"id":"thyme","name":"百里香","en":"Thyme","part":"花與葉","tone":"M","drops":"1","aroma":"辛香草本，濃烈具穿透力。","body":"強力抗菌、抗病毒、提振免疫系統。","emotion":"激發勇氣、斬斷恐懼與拖延，恢復生命動能，象徵「行動與決斷」。適用於需要堅定與突破時期。","notes":"濃度不超過 0.5%","tags":["財富","保護","淨化"]},{"id":"valerian","name":"纈草","en":"Valerian","part":"根部","tone":"B","drops":"1-2","aroma":"濃厚草根氣，帶泥土與木香。","body":"鎮靜神經、助眠、緩解焦慮與失眠。","emotion":"放下控制、進入深層休息，是靈魂的「關機之油」。","notes":"適合睡前或靜心使用。","tags":["放鬆","睡眠"]},{"id":"vetiver","name":"岩蘭草","en":"Vetiver","part":"根部","tone":"B","drops":"1","aroma":"濕潤木根香，濃郁而厚實。","body":"穩定神經、緩解焦慮、調理循環。","emotion":"強化根基與專注力，幫助過度思緒回到身體。","notes":"象徵「扎根與存在感」。是最經典的冥想接地用油。","tags":["放鬆"]},{"id":"wintergreen","name":"冬青","en":"Wintergreen","part":"葉","tone":"M/B","drops":"2-3","aroma":"清涼薄荷甜香，帶樹脂氣。","body":"消炎止痛、舒緩肌肉痠痛、鎮靜神經。","emotion":"幫助釋放壓力與情緒緊繃，帶來清新與釋放感。","notes":"對應喉輪，象徵「清理壓抑與重新呼吸。","tags":["放鬆","睡眠","淨化"]},{"id":"lang-ylang","name":"依蘭","en":"lang Ylang","part":"花","tone":"M/B","drops":"4","aroma":"濃郁甜花香，性感又柔美。","body":"調節荷爾蒙、降低血壓、舒緩焦慮。","emotion":"開啟愛與自我接納，讓人重新感覺被欣賞與美麗。","notes":"心輪與臍輪能量之油，象徵「愛、感官與流動」。","tags":["愛情","放鬆"],"aliases":["依蘭依蘭"]},{"id":"lemongrass","name":"檸檬草","en":"Lemongrass","part":"葉","tone":"M","drops":"1","aroma":"鮮明的檸檬香中帶草本辛辣氣息，潔淨而充滿動力。","body":"富含檸檬醛與香葉醛，是極佳的抗菌與抗炎精油。能促進血液循環、舒緩肌肉酸痛、幫助消化與利尿。","emotion":"能驅散精神倦怠、提振情緒、清理負面能量，像一束光穿透混濁空氣，帶來「重新開始」的力量。當生活陷入停滯、情緒混亂時，檸檬草能快速切換頻率，讓能量重新流動。","notes":"能淨化環境氣味、驅蟲防蚊，是家庭中常備的「清潔能量」，是淨化儀式與空間香氣的經典選擇。","tags":["財富","保護","放鬆","淨化"]},{"id":"alang-complete","name":"完全衣蘭","en":"Alang complete","part":"花","tone":"M/B","drops":"4","aroma":"濃郁甜花香、柔滑性感，層次深厚。","body":"能調節心率與血壓、平衡荷爾蒙、改善焦慮與壓力。對皮膚與頭皮都有柔潤與平衡的效果。","emotion":"象徵「接納與愛自己」。當你覺得不被看見、缺乏價值時，依蘭會以溫柔香氣提醒：「你本來就足夠美麗」。它能讓人從緊繃與防衛中放鬆，重新連結愛與感官愉悅。","notes":"心輪與臍輪之油，象徵「愛與流動」。是恢復女性能量、自我柔軟與心靈開放的代表香氣。","tags":["愛情","放鬆"]},{"id":"vetiver-oil-haiti","name":"海地岩蘭草","en":"Vetiver oil haiti","part":"根部","tone":"B","drops":"1","aroma":"厚重泥土木根氣息，深沈穩定，帶微甜煙氣。","body":"極佳的鎮靜與抗焦慮精油，能調整自律神經、放鬆緊繃肌肉與關節。適合失眠、焦慮、過度用腦者。","emotion":"是「大地之心」的香氣。當人漂浮於思緒與焦慮中時，岩蘭草能引領靈魂回到身體，讓你再次感覺「我在這裡」。","notes":"象徵「扎根與穩定」。海地岩蘭草的頻率深沉，是冥想、接地與靜修最強的守護油之一。","tags":["放鬆","睡眠"]},{"id":"rose-geranium","name":"玫瑰天竺葵","en":"Rose geranium","part":"葉與花頂","tone":"M","drops":"4","aroma":"甜花香中帶淡淡青草氣，柔中帶平衡。","body":"平衡荷爾蒙、調理女性經期與更年期不適、促進皮膚修復與油脂平衡。","emotion":"「情緒平衡之油」。能在極端的情緒間架起橋樑，讓人從憤怒、悲傷、焦慮中回到溫柔穩定。","notes":"心輪能量之油，象徵「溫柔的力量」。是情緒風暴時的心靈中樞，提醒我們即使波動，也能回到愛的中心。","tags":["愛情","放鬆"]},{"id":"geranium-oil-bourbon-type","name":"波旁天竺葵","en":"Geranium oil bourbon type","part":"葉與花頂","tone":"M","drops":"3","aroma":"花香濃郁且帶果甜氣，比一般天竺葵更圓潤豐厚","body":"能調整女性內分泌、舒緩經痛與焦慮、滋潤乾燥肌膚。其平衡油脂分泌的效果極佳。","emotion":"「身心和諧」。當你感到內在衝突或疲憊，它能喚醒內在柔軟與包容感，讓心再次穩定。","notes":"心輪之油，帶「平衡陰陽」的能量，適合用於情緒療癒、親密關係與自我接納練習。","tags":["愛情","放鬆"]},{"id":"clove-leaf-oil","name":"丁香葉","en":"Clove leaf oil","part":"葉","tone":"M/B","drops":"2","aroma":"溫暖辛香、帶甜辣感，氣味厚實。","body":"強效抗菌、抗病毒、止痛、促進循環。能緩解牙痛、肌肉痠痛與風濕。","emotion":"是「重燃意志」的香氣。當人陷入冷漠或意志低落時，丁香能喚醒生命火焰，恢復行動與自信。","notes":"象徵「勇氣與生命力」。它像一團溫暖的火，提醒我們：你的力量仍在。","tags":["財富","保護","淨化"]},{"id":"coriander-seed-oil","name":"芫荽籽","en":"Coriander seed oil","part":"種子","tone":"M","drops":"4","aroma":"辛香溫暖中帶木質氣息，略帶甜感，如陽光曬過的香料田。","body":"促進血液循環、刺激消化與活化新陳代謝的特性。可緩解肌肉痠痛、關節不適與胃腸脹氣，同時幫助身體恢復能量。它還能促進食慾與溫暖身體，適合寒性體質與疲倦者使用。","emotion":"「重燃熱情」的香氣。當你感到倦怠、缺乏靈感或陷入無力時，芫荽籽的溫潤辛香能喚醒內在動力，讓思緒重新流動。它也幫助放下過度理性，回歸身體的智慧與直覺行動。","notes":"象徵「意志與生命力的重新啟動」。適合用於啟動行動力的晨間配方，或冥想前暖身呼吸儀式。","tags":["財富"]},{"id":"galbanum","name":"格蓬（白松香）","en":"Galbanum","part":"樹脂","tone":"M/B","drops":"2","aroma":"青綠草木調中帶樹脂氣，濕潤、厚實又略帶神祕感。","body":"能強化呼吸系統、鎮靜神經與抗發炎。對緊繃的胸腔與淺呼吸者特別有幫助。它還能促進皮膚再生與細胞修復，常用於修護性按摩或養膚油中。","emotion":"當你陷於壓力、疏離感或與身體斷連時，它幫助你回到內在最原始的生命節奏，像走進靜謐森林般恢復真實。","notes":"象徵「真實與歸根」。它能清理現代壓力的人工氣場，重建與自然的能量連結。","tags":["睡眠","淨化"]},{"id":"cajeput","name":"白千層","en":"Cajeput","part":"葉與枝","tone":"M","drops":"3","aroma":"清新木質樟氣，介於茶樹與尤加利之間。","body":"極佳的呼吸道保養油，可減輕鼻塞、咳嗽與支氣管炎症狀。它同時具有抗菌、退燒與緩解肌肉疼痛的效果，是自然療法中的「白光淨化油」。","emotion":"散發清透能量，能幫助釋放焦慮與混亂思緒。它像清晨第一口深呼吸，使人重新感覺頭腦清明、界線分明。","notes":"象徵「清晰與守護」。在靈氣療癒與能量工作中，常用於清理負能量與空間調頻。","tags":["保護","放鬆","淨化"]},{"id":"copaiba-oil","name":"古巴香脂","en":"Copaiba oil","part":"樹脂","tone":"B","drops":"2","aroma":"柔和木質與甜樹脂氣息，平靜且乾淨。","body":"具有抗炎與止痛特性，可舒緩關節疼痛、呼吸不順與皮膚紅腫。它溫和無刺激，是療癒與修護性調油的優良基底。","emotion":"散發溫柔而穩定的力量，幫助人釋放焦慮與怒氣。它像深層的擁抱，讓靈魂安靜下來，重新找到內在節奏。","notes":"象徵「穩定與信任」。是非常適合靜心、冥想或深層療癒儀式的香氣。","tags":["放鬆"]},{"id":"lavandin-grosso","name":"醒目薰衣草","en":"Lavandin grosso","part":"花頂","tone":"M","drops":"4","aroma":"薰衣草香氣更清涼、草本感更強","body":"具鎮痛、抗菌與放鬆作用。適合按摩肌肉、舒緩焦慮。是旅行、睡前、壓力大時的必備安撫油。","emotion":"醒目薰衣草的能量清新卻不飄逸，能使人放下控制、重回自然流動。它帶來「深呼吸」的感覺，提醒心放慢。","notes":"象徵「清醒的寧靜」。是穩定能量場、恢復平衡的療癒型花草香氣。","tags":["保護","放鬆","睡眠","淨化"]},{"id":"grapefruit-pink","name":"粉紅葡萄柚","en":"Grapefruit pink","part":"果皮","tone":"T","drops":"6","aroma":"清新甜潤的柑橘香中帶微苦，輕盈如晨曦。","body":"促進淋巴循環與排毒，幫助消水腫、提升代謝。它還能改善膚色暗沉與疲勞感，是美容與減壓的經典之選。","emotion":"葡萄柚香氣如陽光穿過窗簾，瞬間點亮心房。它帶來希望與清新感，能掃除沮喪、提振信心，讓人重新愛上生活的節奏。","notes":"象徵「樂觀與自我肯定」。是早晨香氣與心靈喚醒儀式的代表精油。","tags":["愛情","放鬆","淨化"]},{"id":"rose-absolute","name":"大馬士革玫瑰","en":"Rose absolute","part":"花","tone":"M/B","drops":"2","aroma":"濃郁花香中夾帶甜潤粉感，奢華且深情。","body":"滋潤肌膚、調節荷爾蒙、舒緩經痛與更年期不適。對心臟與循環系統也有穩定作用。","emotion":"玫瑰是「無條件之愛」的頻率，能治癒心碎、打開胸口的防備，讓人重新相信愛的流動。當你覺得孤單或渴望溫柔，玫瑰會提醒你：「你本身就是愛的源頭。」","notes":"心輪核心能量，象徵「慈悲與自我接納」。是靈性與情感整合中最重要的女神之香。","tags":["愛情","放鬆"]},{"id":"grapefruit","name":"柚子","en":"Grapefruit","part":"果皮","tone":"T","drops":"6","aroma":"比粉紅葡萄柚更明亮、更乾淨，帶微酸與果皮清香。","body":"促進代謝、緊緻肌膚、改善疲勞與倦怠感。它也是提振能量與淨化肝臟的理想精油","emotion":"「輕盈的信心」。當你陷入懷疑、自我批評或缺乏方向時，它能幫助恢復明亮心境，提醒你擁有選擇快樂的權力。","notes":"象徵「快樂的勇氣」。適合早晨使用，為心靈注入新鮮動力。","tags":["財富","淨化"]},{"id":"howood","name":"芳樟","en":"Howood","part":"木材","tone":"M/B","drops":"3","aroma":"柔和木質花香，帶粉感與微甜氣。","body":"強化免疫系統、促進細胞再生、舒緩焦慮與失眠。是修護性按摩與安撫配方的經典成分。","emotion":"芳樟的氣息有一種「被擁抱」的感覺，能讓心靈慢慢鬆弛、回到信任與安定。","notes":"在靜心與睡前擴香中能穩定能場，讓靈魂安住。","tags":["保護","放鬆","睡眠"]},{"id":"resewood","name":"花梨木","en":"Resewood","part":"木材","tone":"M","drops":"3","aroma":"甜木香中帶花氣與粉感，溫暖圓潤。","body":"抗菌、抗老化、幫助肌膚修復與提亮氣色。對於壓力型頭痛與焦慮也有舒緩作用。","emotion":"被稱為「心靈修護師」，能安撫創傷與孤單感。它讓人感覺被理解、被接納，是愛的低語。","notes":"心輪能量油，象徵「同理與柔韌」。適合用於人際療癒與靜坐修心。","tags":["愛情","保護","放鬆","淨化"]},{"id":"peru-balsam","name":"祕魯香脂","en":"Peru balsam","part":"樹脂","tone":"B","drops":"2","aroma":"甜潤濃厚、帶焦糖與香草氣息，溫暖安心。","body":"潤膚、抗炎、鎮痛，對咳嗽與氣管不適有舒緩作用。","emotion":"像一條安全的毯子，包覆著人心的角落，讓悲傷化為柔軟。適合療癒情緒創傷與重建安全感。","notes":"象徵「溫暖的安全」。非常適合冬季與內在孩童療癒時使用。","tags":["放鬆"]},{"id":"mandarin-green","name":"綠橘","en":"Mandarin green","part":"果皮","tone":"T","drops":"6","aroma":"清新果香中帶淡花氣，比紅橘更輕盈明亮。","body":"溫和調理腸胃、安撫消化系統、改善睡眠品質。適合兒童或敏感體質者。亦可促進血液循環與皮膚亮澤。","emotion":"像晨光裡的微笑，能撫慰焦慮、恢復單純喜悅，帶回「沒事的心」。適合身心疲憊、容易擔心的時候使用。","notes":"象徵「純真與溫柔力量」。是內在孩童與安心感的代表香氣。","tags":["放鬆","睡眠"]},{"id":"lemon-lil-italian","name":"義大利檸檬","en":"Lemon lil italian","part":"果皮","tone":"T","drops":"5","aroma":"明亮酸香中帶甜潤，乾淨、清脆、陽光十足。","body":"淨化血液、促進循環、強化免疫系統；幫助集中注意力與提神醒腦。對油性肌膚與暗沉亦有改善作用。","emotion":"是「光之整理師」，能清理混亂思緒與情緒雜訊。當你需要決策、整理、重啟時，檸檬香氣會讓頭腦變明亮、心變簡單。","notes":"象徵「清晰與決心」。它的頻率像一道光，讓人記得：一切可以重新開始。","tags":["保護","淨化"]},{"id":"juniper-berry","name":"杜松子","en":"Juniper berry","part":"漿果","tone":"M","drops":"4","aroma":"木質清爽中帶針葉與樹脂氣息，乾淨透亮。","body":"促進排毒、利尿、淨化腎臟與淋巴系統，常用於身體排濕與循環改善。","emotion":"被稱為「靈魂淨化者」。能清除負面能量與自我懷疑，恢復清明與信任。","notes":"象徵「洞察與清淨」。適合儀式前、能量清理或冥想準備使用。","tags":["淨化"]},{"id":"wormwood","name":"艾草","en":"Wormwood","part":"葉與花","tone":"M/B","drops":"2","aroma":"草本苦香帶樟氣，略煙燻，神秘深邃。","body":"促進血液循環、驅寒除濕、調理女性經痛與經期不順，亦能驅蟲與淨化空氣。","emotion":"「保護與驅除負能量」，能清除陰性情緒與疲憊磁場。用於能量療癒與淨屋時特別有力量。","notes":"象徵「淨化與保護」。適合夜間冥想或能量防護儀式。","tags":["保護","淨化"]},{"id":"amyris","name":"西印度檀香","en":"Amyris","part":"木材","tone":"B","drops":"2","aroma":"柔和木質香，微甜且安靜，帶乳香氣息。","body":"滋養肌膚、放鬆肌肉、調理睡眠與焦慮。它也有溫和的抗炎與抗菌作用。","emotion":"像一位靜默智者，幫助人放下煩亂思緒、回到心的中心。適合冥想、祈禱與深層療癒時使用。","notes":"象徵「靜心與覺知」。在靈性修煉中，它協助穩定能場與開啟直覺。","tags":["保護","放鬆","睡眠","淨化"]},{"id":"verbena-reco","name":"馬鞭草","en":"Verbena reco","part":"葉與花頂","tone":"T/M","drops":"3","aroma":"清新柑橘花香混草本氣，明亮細緻。","body":"強化神經、緩解焦慮與失眠、改善腸胃消化與頭痛症狀。","emotion":"「心靈平衡」的香氣，能減少過度的控制慾與完美主義，讓人學會溫柔放手。","notes":"象徵「信任與臣服」。當靈魂緊繃時，它會帶你回到流動的狀態。","tags":["放鬆","睡眠"]}];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function round(n,d=1){const p=10**d;return Math.round((Number(n)||0)*p)/p}
function fmt(n,d=1){const r=round(n,d);return Number.isInteger(r)?String(r):r.toFixed(d).replace(/0+$/,"").replace(/\.$/,"")}
function toneParts(t){return String(t||"M").split("/").filter(x=>"TMB".includes(x))}
function primaryTone(t){const p=toneParts(t);return p[0]||"M"}

/* 依權重把整數總量分配出去（最大餘數法），每列至少 1（總量足夠時）。 */
function allocate(total,weights){
 const n=weights.length; if(!n) return [];
 const sum=weights.reduce((a,b)=>a+b,0)||1;
 const exact=weights.map(w=>total*w/sum), base=exact.map(Math.floor);
 let left=total-base.reduce((a,b)=>a+b,0);
 exact.map((v,i)=>({i,f:v-base[i]})).sort((a,b)=>b.f-a.f).slice(0,left).forEach(x=>base[x.i]++);
 if(total>=n) base.forEach((v,i)=>{if(v===0){let j=base.indexOf(Math.max(...base));if(base[j]>1){base[j]--;base[i]=1}}});
 return base;
}

/* 份數：依香調給每支精油幾份（例如前調 3、中調 2、後調 1） */
function partsByTone(rows,t,m,b){const w={T:t,M:m,B:b};return rows.map(r=>w[primaryTone(r.tone)])}
/* 把百分比化成簡單份數，例如 40/40/20 → 2/2/1 */
function simplifyParts(arr){
 const g=(a,b)=>b?g(b,a%b):a;
 let v=arr.map(x=>Math.max(0,Number(x)||0));
 if(v.every(x=>Number.isInteger(x)&&x<=10)) return v;
 const sum=v.reduce((a,b)=>a+b,0)||1; v=v.map(x=>Math.max(1,Math.round(x/sum*20)));
 const d=v.reduce((a,b)=>g(a,b)); return v.map(x=>x/d);
}
/* 依香調比例方案分配比例（例如 3:2:1）。 */
function ratiosByTone(rows,t,m,b){
 const w={T:t,M:m,B:b}, cnt={T:0,M:0,B:0};
 rows.forEach(r=>cnt[primaryTone(r.tone)]++);
 const active=Object.keys(cnt).filter(k=>cnt[k]); const tot=active.reduce((a,k)=>a+w[k],0)||1;
 const raw=rows.map(r=>{const k=primaryTone(r.tone);return w[k]/tot*100/cnt[k]});
 const ints=allocate(100,raw.map(x=>x)).map(x=>x); // 加總 100
 return ints;
}

function diffuserDrops(p){
 const area=Math.max(1,Number(p.area)||5), min=Math.max(10,Number(p.minutes)||30);
 if(p.device==="nebulizer") return Math.round(Math.max(1,Number(p.premix)||5)*20);
 if(p.device==="stone") return Math.min(6,Math.max(3,Math.round(3+area*.15)));
 return Math.min(10,Math.max(3,Math.round(3+area*.4+(min>60?1:0))));
}

/* 主計算：studio = {mode, params, rows:[{oil,tone,ratio}]}；ctx = {findOil, stockOf, invByName} */
function compute(studio,ctx){
 const mode=MODES[studio.mode]||MODES.rollon, p=studio.params||{};
 const rows=(studio.rows||[]).filter(r=>r.oil);
 const sum=rows.reduce((a,r)=>a+Math.max(0,Number(r.ratio)||0),0);
 const shares=rows.map(r=>sum?Math.max(0,Number(r.ratio)||0)/sum:1/rows.length);
 const out={mode:studio.mode,lines:[],warnings:[],infos:[],sum,totalDrops:0,tmb:{T:0,M:0,B:0},materials:[]};
 rows.forEach((r,i)=>{const parts=toneParts(r.tone);parts.forEach(t=>out.tmb[t]+=shares[i]/parts.length)});
 const dup=rows.map(r=>r.oil).filter((x,i,a)=>a.indexOf(x)!==i); if(dup.length) out.warnings.push(`${[...new Set(dup)].join("、")} 重複出現，請合併成一列。`);

 if(mode.kind==="liquid"){
  const qty=Math.max(1,Number(p.qty)||1), vol=Math.max(1,Number(p.volume)||mode.vol), conc=Math.max(0,Number(p.conc)||0);
  const totalMl=qty*vol, totalDrops=Math.round(totalMl*conc/100*20);
  const drops=allocate(totalDrops,shares);
  out.totalMl=totalMl; out.totalDrops=drops.reduce((a,b)=>a+b,0);
  out.lines=rows.map((r,i)=>({oil:r.oil,tone:r.tone,share:shares[i],drops:drops[i],ml:drops[i]/20,need:drops[i]/20,unit:"ml",pct:totalMl?drops[i]/20/totalMl*100:0}));
  out.base={name:p.base||"",ml:Math.max(0,totalMl-out.totalDrops/20)};
  out.realConc=totalMl?out.totalDrops/20/totalMl*100:0;
  if(conc<mode.range[0]||conc>mode.range[1]) out.warnings.push(`${mode.label}濃度 ${fmt(conc)}% 不在建議範圍（${mode.rangeText}）。`);
  const skin=mode.skin||(studio.mode==="spray"&&p.use==="body");
  if(studio.mode==="spray"&&p.use==="body"&&conc>2) out.warnings.push("噴在身上的噴霧建議 1–2%。");
  if(studio.mode==="spray") out.infos.push("精油不溶於水，伏特加濃度也不足以完全溶解；使用前請搖勻，或改用香水基劑。");
  if(skin) out.lines.forEach(l=>{
   const s=SAFETY[l.oil]; if(!s) return;
   l.limit=s.max;
   if(l.pct>s.max+1e-9){l.over=1;out.warnings.push(`${l.oil} 在成品中約 ${fmt(l.pct,2)}%，超過皮膚用建議上限 ${s.max}%${s.photo?"（具光敏性）":""}。${s.note?s.note+"。":""}`)}
   else if(s.photo) out.infos.push(`${l.oil} 具光敏性：塗抹後 12 小時內避免日曬。`);
  });
  out.materials=out.lines.map(l=>({name:l.oil,amount:l.ml,unit:"ml"})).concat(out.base.name&&out.base.ml>0?[{name:out.base.name,amount:out.base.ml,unit:"ml"}]:[]);
  if(p.bottle) out.materials.push({name:p.bottle,amount:qty,unit:"個"});
  if(p.pack) out.materials.push({name:p.pack,amount:qty,unit:"個"});
 } else if(mode.kind==="candle"){
  const qty=Math.max(1,Number(p.qty)||1), w=Math.max(1,Number(p.weight)||180), pct=Math.max(0,Number(p.pct)||0);
  const total=qty*w, frag=total*pct/100, wax=total-frag;
  out.total=total; out.frag=frag; out.wax={name:p.wax||"",g:wax};
  out.lines=rows.map((r,i)=>{const g=frag*shares[i], ml=g/.9;return {oil:r.oil,tone:r.tone,share:shares[i],g,ml,need:ml,unit:"ml",drops:Math.round(ml*20)}});
  out.totalDrops=out.lines.reduce((a,l)=>a+l.drops,0);
  if(pct>10) out.warnings.push(`精油添加 ${fmt(pct)}% 超過一般蠟材上限 10%，容易出油或影響燃燒。`);
  else if(pct<mode.range[0]) out.infos.push(`添加 ${fmt(pct)}% 偏低，天然精油蠟燭香氣可能較淡。`);
  out.materials=out.lines.map(l=>({name:l.oil,amount:l.ml,unit:"ml"})).concat(out.wax.name?[{name:out.wax.name,amount:wax,unit:"g"}]:[]);
  if(p.wick) out.materials.push({name:p.wick,amount:qty*(Number(p.wickPer)||1),unit:"支"});
  if(p.jar) out.materials.push({name:p.jar,amount:qty,unit:"個"});
  if(p.pack) out.materials.push({name:p.pack,amount:qty,unit:"個"});
  const heavy=out.lines.filter(l=>/肉桂|丁香/.test(l.oil)); if(heavy.length) out.infos.push("肉桂、丁香類在蠟燭中容易刺鼻，建議占比不超過 15%。");
 } else {
  const total=diffuserDrops(p); const drops=allocate(total,shares);
  out.totalDrops=drops.reduce((a,b)=>a+b,0); out.device=p.device;
  out.lines=rows.map((r,i)=>({oil:r.oil,tone:r.tone,share:shares[i],drops:drops[i],ml:drops[i]/20,need:drops[i]/20,unit:"ml"}));
  if(p.device==="nebulizer") out.infos.push(`無水霧化機不用滴數：先調好一瓶 ${fmt(p.premix||5)} ml 複方，建議間歇使用（開 15 分、關 15 分）。`);
  if(rows.length>5) out.infos.push("擴香以 2–5 支精油較容易聞出層次。");
  if(p.device!=="nebulizer"&&rows.length&&total<rows.length*2) out.warnings.push(`這次只用 ${total} 滴，卻有 ${rows.length} 支精油，每支只分到 1–2 滴，比例調整幾乎沒有作用。建議減到 ${Math.max(2,Math.floor(total/2))} 支以內，或改用「無水霧化機」先調一小瓶複方。`);
  out.materials=out.lines.map(l=>({name:l.oil,amount:l.ml,unit:"ml"}));
 }
 if(ctx){
  out.materials.forEach(m=>{const inv=ctx.invByName(m.name);m.have=inv?Number(inv.amount)||0:0;m.invId=inv?.id;m.enough=!!inv&&m.have+1e-9>=m.amount});
  out.lines.forEach(l=>{const m=out.materials.find(x=>x.name===l.oil);l.have=m?.have||0;l.enough=m?.enough});
 }
 return out;
}

/* 香氣結構的本地分析（不需 AI） */
function localAnalysis(res,findOil){
 if(!res.lines.length) return null;
 const fam={};
 res.lines.forEach(l=>{const o=findOil(l.oil);const text=(o?.aroma||"")+l.oil;FAMILIES.forEach(f=>{if(f.re.test(text))fam[f.k]=(fam[f.k]||0)+l.share})});
 const fams=Object.entries(fam).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
 const {T,M,B}=res.tmb, adv=[];
 if(T>.55) adv.push("前調超過一半，開瓶很亮但散得快，可以加一支後調收尾。");
 if(B<.1) adv.push("幾乎沒有後調，香氣留不久；可加入雪松、檀香或岩蘭草 1–2 滴。");
 if(B>.4) adv.push("後調偏重，整體沉穩但可能悶，可提高柑橘或草本讓它透氣。");
 if(M<.2&&res.lines.length>1) adv.push("中調偏少，前後調之間少了橋樑，可加花香或草本。");
 if(!adv.length) adv.push("前中後調分布平均，結構完整。");
 const life=B>=.3?"長":B>=.15?"中":"短";
 return {families:fams,advice:adv,longevity:life};
}

/* 成本：每樣材料的單位成本 = 進價 ÷ 購入量 */
function unitCost(inv){const p=Number(inv?.price),q=Number(inv?.priceQty);return p>0&&q>0?p/q:null}
function costOf(res,invByName,qty){
 let total=0; const missing=[];
 res.materials.forEach(m=>{const u=unitCost(invByName(m.name));if(u==null){missing.push(m.name);m.cost=null}else{m.cost=m.amount*u;total+=m.cost}});
 return {total,per:qty>0?total/qty:total,missing};
}

function toTrad(s){let o=String(s);for(const [k,v] of Object.entries(S2T).sort((a,b)=>b[0].length-a[0].length))o=o.split(k).join(v);return o}
function parseBlend(text,findOil){
 const t=toTrad(text).replace(/[（(][^）)]*[）)]/g,"");
 const parts=t.split(/[+＋、,，;；\n]|\s+和\s+|\s+加\s+/).map(x=>x.trim()).filter(Boolean);
 const rows=[];
 for(const p of parts){
  const m=p.match(/^(.+?)\s*[:：x×*]?\s*(\d+(?:\.\d+)?)\s*(份|滴|%|ml)?$/);
  if(!m) continue;
  let name=m[1].replace(/精油$/,"").trim(); name=OIL_ALIAS[name]||name;
  const o=findOil(name)||findOil(name.replace(/^(真正|甜|野生|有機)/,""));
  rows.push({oil:o?o.name:name,tone:o?o.tone:"M",ratio:Number(m[2]),known:!!o});
 }
 return rows;
}
/* 一次貼多款：每行「名稱｜配方」 */
function parseMany(text,findOil){
 return String(text).split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
  const m=toTrad(l).match(/^(?:\d+[.、\s]*)?(.+?)\s*[|｜:：]\s*(.+)$/); if(!m) return null;
  const rows=parseBlend(m[2],findOil); return rows.length?{name:m[1].trim(),rows}:null;
 }).filter(Boolean);
}

/* ---------- 儲存：本機快取＋Claude 雲端（每人私有） ---------- */
const sync={db:null,uid:null,state:"local",timers:{},writing:{},pending:new Set()};
function touch(...docs){
 _oils=null; const now=Date.now();
 docs.forEach(d=>{S._meta[d]=now;sync.pending.add(d)});
 lsSet(LS_KEY,S); scheduleSync(); renderSync();
}
function scheduleSync(){if(!sync.db)return;clearTimeout(sync.t);sync.t=setTimeout(flush,900)}
async function flush(){
 if(!sync.db||!sync.uid) return;
 const list=[...sync.pending]; sync.pending.clear();
 for(const d of list){
  if(sync.writing[d]){sync.pending.add(d);continue}
  sync.writing[d]=true; sync.state="busy"; renderSync();
  try{await sync.db.collection("data/users/"+sync.uid).doc(d).set({v:JSON.stringify(S[d]),updatedAt:S._meta[d]||Date.now()})}
  catch(e){if(e?.code==="invalid_argument"||e?.code==="revoked"||e?.code==="not_granted"){sync.db=null;sync.state="local";sync.pending.clear();sync.writing[d]=false;renderSync();return}if(e?.code==="quota_exceeded")toast("雲端空間已滿，請匯出備份後清理舊紀錄。");sync.pending.add(d)}
  finally{sync.writing[d]=false}
 }
 sync.state=sync.pending.size?"busy":"on"; renderSync();
 if(sync.pending.size) setTimeout(flush,4000);
}
async function connectDb(){
 if(!window.claude?.use) return;
 try{
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user) return;
  const id=await user.id(); if(!id) return;
  sync.db=db; sync.uid=id; sync.state="busy"; renderSync();
  const snap=await db.collection("data/users/"+id).get();
  const remote={}; snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});
  let changed=false;
  DOCS.forEach(k=>{
   const r=remote[k], lt=S._meta[k]||0;
   if(r&&(r.updatedAt||0)>lt){try{S[k]=JSON.parse(r.v);S._meta[k]=r.updatedAt;changed=true}catch(e){}}
   else if(!r||lt>(r.updatedAt||0)) sync.pending.add(k);
  });
  if(changed){_oils=null;lsSet(LS_KEY,S);render()}
  sync.state="on"; renderSync(); if(sync.pending.size) flush();
 }catch(e){sync.db=null;sync.state="local";renderSync()}
}
function renderSync(){
 const t={on:"已同步到你的 Claude 帳號",busy:"同步中…",local:"只存在這個瀏覽器"}[sync.state];
 document.querySelectorAll("[data-sync]").forEach(el=>{el.className="sync "+sync.state;el.innerHTML=`<i></i>${t}`});
}

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function dialog(title,bodyHtml,{actions=[],onOpen}={}){
 const sc=document.createElement("div");sc.className="scrim";
 sc.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-label="${h(title)}"><div class="dh"><h3>${h(title)}</h3><button class="iconbtn" data-x aria-label="關閉">×</button></div><div class="db">${bodyHtml}</div>${actions.length?`<div class="row" style="justify-content:flex-end;margin-top:16px">${actions.map((a,i)=>`<button class="btn ${a.cls||""}" data-a="${i}">${h(a.label)}</button>`).join("")}</div>`:""}</div>`;
 const close=()=>sc.remove();
 sc.addEventListener("click",e=>{if(e.target===sc||e.target.closest("[data-x]"))close();const b=e.target.closest("[data-a]");if(b){const a=actions[+b.dataset.a];if(a.run&&a.run(sc)===false)return;close()}});
 document.addEventListener("keydown",function esc(e){if(e.key==="Escape"){close();document.removeEventListener("keydown",esc)}});
 document.body.append(sc); onOpen&&onOpen(sc); sc.querySelector("input,select,textarea,button.btn")?.focus(); return sc;
}

function detectMode(t){return /蠟燭/.test(t)?"candle":/擴香|水氧|擴香石/.test(t)?"diffuser":/滾珠/.test(t)?"rollon":/按摩/.test(t)?"massage":/臉/.test(t)?"face":/香水|香氛油/.test(t)?"perfume":/噴霧/.test(t)?"spray":null}
function localPick({themes=[],re=null,mode="rollon",onlyStock=false}){
 const m=MODES[mode]; const skin=m.skin;
 const scored=oils().filter(o=>!onlyStock||stockOf(o.name)>0).map(o=>{let s=0;themes.forEach(t=>{if((o.tags||[]).includes(t))s+=3});if(re&&re.test([o.aroma,o.emotion,o.body,o.notes].join(" ")))s+=2;if(stockOf(o.name)>0)s+=1.5;if(skin&&SAFETY[o.name]&&SAFETY[o.name].max<1)s-=3;return {o,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
 const pick=[],need={T:2,M:2,B:1};
 for(const {o} of scored){const t=primaryTone(o.tone);if(need[t]>0){pick.push(o);need[t]--}if(pick.length>=5)break}
 return pick;
}
function localAI(text){
 const themes=THEMES.filter(t=>text.includes(t)||({財富:/財|錢|豐盛|生意/,愛情:/愛|戀|約會|魅力/,保護:/保護|界線|防護/,放鬆:/放鬆|壓力|紓壓|舒緩/,睡眠:/睡|眠|晚上|夜/,淨化:/淨化|淨|清理|空間/})[t].test(text));
 const need=NEEDS.find(n=>n.re.test(text));
 if(/補貨|採購|買/.test(text)){
  const low=S.inventory.filter(i=>i.category==="精油"&&isLow(i)).map(i=>i.name);
  const cnt={};S.records.forEach(r=>(r.materials||[]).forEach(m=>cnt[m.name]=(cnt[m.name]||0)+1));
  const hot=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(n=>findOil(n)).slice(0,5);
  return {role:"assistant",local:1,reply:`低庫存的精油：${low.join("、")||"目前沒有"}。\n最常用的：${hot.join("、")||"還沒有製作紀錄"}。\n建議先補「常用又低庫存」的，再補六大主題各缺的一支基礎油（例如雪松、甜橙、薰衣草）。`,buy:low};
 }
 const mode=detectMode(text)||"rollon";
 const picked=localPick({themes,re:need?.re,mode,onlyStock:/現有|庫存/.test(text)||ui.aiStock});
 if(!picked.length) return {role:"assistant",local:1,reply:"我需要多一點線索：想做什麼產品（蠟燭、噴霧、滾珠、擴香）？想要什麼感覺或主題？"};
 const rows=picked.map(o=>({tone:o.tone}));const r=partsByTone(rows,3,2,1);
 return {role:"assistant",local:1,reply:`依「${[...themes,need?.k].filter(Boolean).join("、")||"你的描述"}」挑了 ${picked.length} 支${ui.aiStock?"有庫存的":""}精油，以前中後調 3:2:1 起步。帶進調配台後可以再微調。`,formula:{name:(themes[0]||need?.k||"日常")+"配方",mode,concentration:MODES[mode].conc||MODES[mode].pct||null,oils:picked.map((o,i)=>({name:o.name,ratio:r[i],why:(o.aroma||"").slice(0,30)})),aroma:"",tips:[]},buy:[]};
}

function oilFiltered(){
 const q=ui.oilQ.trim(), need=NEEDS.find(n=>n.k===ui.oilNeed);
 return oils().filter(o=>{
  if(ui.oilTone&&!toneParts(o.tone).includes(ui.oilTone)) return false;
  if(ui.oilTheme&&!(o.tags||[]).includes(ui.oilTheme)) return false;
  if(ui.oilStock&&stockOf(o.name)<=0) return false;
  if(ui.oilFav&&!isFav(o)) return false;
  const text=[o.name,o.en,o.aroma,o.body,o.emotion,o.notes,(o.aliases||[]).join(" ")].join(" ");
  if(need&&!(need.re.test(text)||(need.tags||[]).some(t=>(o.tags||[]).includes(t)))) return false;
  if(q&&!text.toLowerCase().includes(q.toLowerCase())) return false;
  return true;
 });
}

function labelCardHtml(L){

function wrapText(ctx,text,maxW){const out=[];let line="";for(const ch of String(text)){if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}
function labelPng(L){
 const W=1000,H=640,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 const font=(s,w=400)=>`${w} ${s}px "LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif`;
 x.fillStyle="#fbfcf8";x.fillRect(0,0,W,H);x.strokeStyle="#1d2b25";x.lineWidth=4;x.strokeRect(14,14,W-28,H-28);x.lineWidth=1.5;x.strokeStyle="#c9d1c3";x.strokeRect(26,26,W-52,H-52);
 let y=80;x.fillStyle="#b86a24";x.font=font(26,700);x.fillText(L.brand,56,y);
 x.fillStyle="#1d2b25";x.font=font(48,700);x.fillText(L.name,56,y+58);
 x.textAlign="right";x.font=font(26);x.fillStyle="#5d6b63";x.fillText(L.type,W-56,y);x.font=font(30,700);x.fillStyle="#1d2b25";x.fillText(L.net,W-56,y+46);x.textAlign="left";
 y+=92;x.strokeStyle="#1d2b25";x.lineWidth=2;x.beginPath();x.moveTo(56,y);x.lineTo(W-56,y);x.stroke();y+=40;
 for(const [k,v] of [["成分",L.ingredients],["使用方式",L.usage],["注意事項",L.caution]]){if(!v)continue;x.font=font(22,700);x.fillStyle="#1d2b25";x.fillText(k,56,y);x.font=font(22);x.fillStyle="#2c3a33";const lines=wrapText(x,v,W-56-170);lines.slice(0,4).forEach((ln,i)=>x.fillText(ln,170,y+i*32));y+=Math.min(lines.length,4)*32+14}
 x.font=font(19);x.fillStyle="#5d6b63";const foot=[`製造日期 ${L.made}`,`批號 ${L.batch}`,`產地 ${L.origin}`,L.maker&&`製造者 ${L.maker}`,L.contact&&`聯絡 ${L.contact}`].filter(Boolean).join("　");
 wrapText(x,foot,W-112).slice(0,2).forEach((ln,i)=>x.fillText(ln,56,H-82+i*28));
 return new Promise(r=>c.toBlob(r,"image/png"));
}

  case "row-add": studio.rows.push({oil:"",tone:"M",ratio:1}); saveStudio(); render(); break;
  case "row-del": studio.rows.splice(rowI(),1); saveStudio(); render(); break;
  case "preset": {const r=partsByTone(studio.rows,+d.t,+d.m,+d.b);studio.rows.forEach((x,i)=>x.ratio=r[i]);saveStudio();render();break}
  case "even": {const r=studio.rows.map(()=>1);studio.rows.forEach((x,i)=>x.ratio=r[i]);saveStudio();render();break}
  case "studio-new": ask("清空調配台","目前的配方會被清空（已儲存的配方不受影響）。","清空").then(ok=>{if(ok){studio=defaultStudio();studio.rows=[];setMode("spray");render()}}); break;
  case "save-recipe": saveRecipe(); break;
  case "make": makeIt(); break;
  case "ai-analyze": aiAnalyze(); break;
  case "copy-label": navigator.clipboard?.writeText(labelText()).then(()=>toast("已複製配方文字"),()=>toast("無法複製")); break;
  case "shop-missing": compute(studio,ctx).materials.filter(x=>x.enough===false).forEach(x=>addShop(x.name,"調配台："+(studio.name||"未命名"))); renderLabel(); break;
  case "shop-add": addShop(d.name,d.reason); break;
  case "ai-suggest": askAI(d.q); break;
  case "ai-stop": ui.aiBusy?.abort(); break;
  case "ai-clear": ui.chat=[]; render(); break;
  case "ai-use": {const f=ui.chat[+d.i].formula;const md=f.mode;studioFromRecipe({name:f.name,mode:md,status:"草稿",rows:(()=>{const p=simplifyParts(f.oils.map(o=>o.ratio));return f.oils.map((o,i)=>({oil:o.name,ratio:p[i]}))})(),notes:f.aroma,params:{}});if(f.concentration){if(MODES[md].kind==="liquid")studio.params.conc=f.concentration;else if(MODES[md].kind==="candle")studio.params.pct=f.concentration}studio.recipeId=null;saveStudio();go("studio");break}
  case "ai-buy": (ui.chat[+d.i].buy||[]).forEach(n=>addShop(n,"AI 建議")); break;
  case "rec-tab": ui.recTab=d.tab; if(ui.view==="recipes") render(); break;
  case "rec-mode": ui.recMode=d.v; render(); break;
  case "rec-kind": ui.recKind=d.v; render(); break;
  case "rec-open": studioFromRecipe(S.recipes.find(r=>r.id===d.id)); go("studio"); break;
  case "rec-del": {const r=S.recipes.find(x=>x.id===d.id);ask("刪除配方",`確定刪除「${h(r.name)} V${r.version||1}」？`,"刪除","danger").then(ok=>{if(ok){S.recipes=S.recipes.filter(x=>x.id!==d.id);touch("recipes");render()}});break}
  case "record-del": {const r=S.records.find(x=>x.id===d.id);dialog("刪除紀錄",`<p>刪除「${h(r.name)}」${dateStr(r.ts)} 的紀錄？</p>`,{actions:[{label:"取消",cls:"ghost"},...(r.deducted?[{label:"刪除並退回庫存",cls:"ghost",run:()=>{(r.materials||[]).forEach(m=>{const inv=invByName(m.name);if(inv)inv.amount=round(inv.amount+m.amount,2)});S.records=S.records.filter(x=>x.id!==r.id);touch("records","inventory");render()}}]:[]),{label:"刪除",cls:"danger",run:()=>{S.records=S.records.filter(x=>x.id!==r.id);touch("records");render()}}]});break}
  case "usage-add": {const name=$("#u-name").value.trim();if(!name)return toast("請輸入產品名稱");S.records.unshift({id:uid(),kind:"usage",ts:Date.now(),name,scene:$("#u-scene").value.trim(),duration:$("#u-dur").value.trim(),rating:usageRating,note:$("#u-note").value.trim(),materials:[]});usageRating=0;touch("records");render();toast("已儲存使用回饋");break}
  case "manual-add": {const name=$("#m-name").value.trim();const mats=$("#m-mats").value.split("\n").map(l=>l.split(/[,，]/).map(x=>x.trim())).filter(x=>x[0]).map(([n,a,u])=>({name:n,amount:Number(a)||0,unit:u||"ml"}));if(!name||!mats.length)return toast("請填寫產品名稱與原料");const ded=$("#m-deduct").checked;if(ded)mats.forEach(m=>{const inv=invByName(m.name);if(inv)inv.amount=round(Math.max(0,inv.amount-m.amount),2)});S.records.unshift({id:uid(),kind:"production",ts:Date.now(),name,materials:mats,deducted:ded,note:$("#m-note").value.trim()});touch("records","inventory");render();toast("已儲存");break}
  case "oil-open": if(e.target.closest(".star"))break; oilDetail(d.id); break;
  case "oil-fav": {e.stopPropagation();const o=oils().find(x=>x.id===d.id);const f=S.misc.favorites;const i=f.indexOf(o.name);if(i>=0)f.splice(i,1);else f.push(o.name);touch("misc");render();break}
  case "oil-tone": ui.oilTone=d.v; render(); break;
  case "oil-theme": ui.oilTheme=ui.oilTheme===d.v?"":d.v; render(); break;
  case "oil-need": ui.oilNeed=ui.oilNeed===d.v?"":d.v; render(); break;
  case "oil-reset": Object.assign(ui,{oilQ:"",oilTone:"",oilTheme:"",oilNeed:"",oilStock:false,oilFav:false}); render(); break;
  case "oil-new": oilForm(null); break;
  case "num-use": {const all=NUMEROLOGY[d.n];const names=all.map(n=>findOil(n)?.name).filter(Boolean);const miss=all.filter(n=>!findOil(n));studio=Object.assign(defaultStudio(),{mode:studio.mode,params:studio.params});studio.rows=names.map(n=>({oil:n,tone:findOil(n).tone,ratio:0}));const r=partsByTone(studio.rows,3,2,1);studio.rows.forEach((x,i)=>x.ratio=r[i]);studio.name=`靈數 ${d.n} 號靈感`;studio.status="草稿";studio.recipeId=null;studio.tags=["生命靈數"];studio.notes=`以生命靈數 ${d.n} 號（${all.join("、")}）為靈感，可依喜好與庫存自由替換。`+(miss.length?`\n${miss.join("、")} 不在精油庫，可換成同感覺的精油。`:"");saveStudio();go("studio");setTimeout(()=>toast(miss.length?`${miss.join("、")} 不在精油庫，記得換成類似的精油`:"已帶入，當作起點自由調整吧"),300);break}
  case "inv-cat": ui.invCat=d.v; render(); break;
  case "inv-new": invForm(null); break;
  case "inv-edit": invForm(S.inventory.find(i=>i.id===el.closest(".inv-item").dataset.id)); break;
  case "inv-toggle": {const id=el.closest(".inv-item").dataset.id;ui.invOpen=ui.invOpen===id?null:id;render();break}
  case "inv-step": {const it=S.inventory.find(i=>i.id===el.closest(".inv-item").dataset.id);it.amount=round(Math.max(0,Number(it.amount)+Number(d.d)),2);touch("inventory");render();break}
  case "shop-done": {const s=S.misc.shopping[+d.i];const inv=invByName(s.name);dialog("已購買："+s.name,`<div class="grid g2"><label class="f">購入數量${inv?`（${h(inv.unit)}）`:""}<input id="buyQty" type="number" step="any" value="${inv?.unit==="g"?500:10}"></label><label class="f">這次花了 NT$（選填）<input id="buyPrice" type="number" min="0" step="any" placeholder="更新進價"></label></div>${inv?"":`<p class="small muted">庫存裡還沒有這個品項，會以精油、ml 建立。</p>`}`,{actions:[{label:"取消",cls:"ghost"},{label:"加入庫存",run:sc=>{const q=Number(sc.querySelector("#buyQty").value)||0,pr=Number(sc.querySelector("#buyPrice").value)||0;if(inv){inv.amount=round(inv.amount+q,2);if(pr&&q){inv.price=pr;inv.priceQty=q}}else S.inventory.push({id:uid(),name:s.name,category:findOil(s.name)?"精油":"其他",amount:q,capacity:q||10,unit:"ml",spec:"",reorder:3,...(pr&&q?{price:pr,priceQty:q}:{})});S.misc.shopping.splice(+d.i,1);touch("inventory","misc");render();toast("已入庫")}}]});break}
  case "shop-del": S.misc.shopping.splice(+d.i,1); touch("misc"); render(); break;
  case "shop-clear": S.misc.shopping=[]; touch("misc"); render(); break;
  case "shop-manual": {const n=$("#shopName").value.trim();if(n)addShop(n,"手動");break}
 }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".oil-row"))oilDetail(e.target.dataset.id)});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.p){studio.params[t.dataset.p]=t.type==="number"?Number(t.value):t.value;saveStudio();if(t.tagName==="SELECT"&&t.dataset.p==="device")render();else renderLabel();return}
 if(t.dataset.s){studio[t.dataset.s]=t.dataset.s==="tags"?t.value.split(/[,，、]+/).map(x=>x.trim()).filter(Boolean):t.value;saveStudio();if(t.dataset.s!=="notes"&&t.dataset.s!=="tags")renderLabel();return}
 if(t.dataset.r){const i=+t.closest(".orow").dataset.i,r=studio.rows[i];
  if(t.dataset.r==="ratio"){r.ratio=Number(t.value)||0;saveStudio();renderLabel();const sum=document.getElementById("ratioSum");if(sum)sum.textContent=partsSummary();document.querySelectorAll(".orow").forEach(el=>{const s=el.querySelector("[data-share]");if(s)s.textContent=shareText(+el.dataset.i)});return}
  if(t.dataset.r==="oil"){r.oil=t.value;const o=findOil(t.value);if(o)r.tone=o.tone}
  if(t.dataset.r==="tone") r.tone=t.value;
  saveStudio();render();return}
 if(t.dataset.ui){ui[t.dataset.ui]=t.value;const id=t.id,pos=t.selectionStart;render();const n=id?document.getElementById(id):document.querySelector(`[data-ui="${t.dataset.ui}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
 if(t.dataset.uc){ui[t.dataset.uc]=t.checked;render();return}
 if(t.dataset.inv){const it=S.inventory.find(i=>i.id===t.closest(".inv-item").dataset.id);it[t.dataset.inv]=round(Number(t.value)||0,2);clearTimeout(t._tm);t._tm=setTimeout(()=>{touch("inventory")},500);return}
 if(t.id==="aiStock"){ui.aiStock=t.checked}
});
document.addEventListener("change",e=>{if(e.target.dataset.inv){touch("inventory");render()}});
document.addEventListener("submit",e=>{if(e.target.id==="aiForm"){e.preventDefault();const v=$("#aiInput").value;askAI(v)}});
document.addEventListener("keydown",e=>{if(e.target.id==="aiInput"&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();askAI(e.target.value)}});

/* ---------- 啟動 ---------- */
(function start(){
 applyLayout(layout());
 ensureCapacity();
 if(S._autoMigrated){delete S._autoMigrated;lsSet(LS_KEY,S);setTimeout(()=>toast("已自動搬入這個瀏覽器裡的舊版資料"),400)}
 const v=location.hash.slice(1); ui.view=VIEWS.some(x=>x[0]===v)?v:"home";
 render();
 if(window.claude?.use){
  claude.use("sample").then(s=>{if(s){sampleFn=s;aiReady=true;if(ui.view==="ai")render()}}).catch(()=>{});
  connectDb();
 }
})();

</script>
</body>
</html>
